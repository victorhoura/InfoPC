name: Conferencia

# So roda na mao. Testa o que o CI normal nao cobre, em Linux de verdade: pkexec e polkit reais, ubuntu-drivers,
# hidepid, pen drive FAT e exFAT, janela sob GNOME (Wayland, com XWayland) e KDE (X11) e o pacote arm64 em outras distribuicoes.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  root:
    name: pkexec, ubuntu-drivers e hidepid
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Preparar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq polkitd pkexec ubuntu-drivers-common smartmontools > /dev/null
          sudo apt-get remove -y -qq cowsay > /dev/null || true
          sudo systemctl start polkit || true
          dotnet build linux/tests/InfoPC.Tests/InfoPC.Tests.csproj -c Release -v q
          dotnet publish linux/src/InfoPC.Linux/InfoPC.Linux.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publicado -v q
      - name: Polkit autoriza
        env:
          CONFERENCIA: polkit-sim
          DISPLAY: ":99"
        run: |
          printf 'polkit.addRule(function(a, s) { if (a.id == "org.freedesktop.policykit.exec" && s.user == "%s") return polkit.Result.YES; });\n' "$USER" | sudo tee /etc/polkit-1/rules.d/90-conferencia.rules
          sudo systemctl restart polkit; sleep 2
          pkexec id -u
          dotnet test linux/tests/InfoPC.Tests/InfoPC.Tests.csproj -c Release --no-build --filter Categoria=Conferencia --logger "console;verbosity=normal"
          ./publicado/InfoPC --discos --smart | head -30
      - name: Polkit recusa
        if: always()
        env:
          CONFERENCIA: polkit-nao
          DISPLAY: ":99"
        run: |
          printf 'polkit.addRule(function(a, s) { if (a.id == "org.freedesktop.policykit.exec") return polkit.Result.NO; });\n' | sudo tee /etc/polkit-1/rules.d/90-conferencia.rules
          sudo systemctl restart polkit; sleep 2
          if pkexec id -u; then echo "pkexec deveria recusar"; exit 1; fi
          dotnet test linux/tests/InfoPC.Tests/InfoPC.Tests.csproj -c Release --no-build --filter Categoria=Conferencia --logger "console;verbosity=normal"
          ./publicado/InfoPC --discos --smart | head -12
      - name: Hidepid
        if: always()
        env:
          CONFERENCIA: hidepid
        run: |
          sudo mount -o remount,hidepid=2 /proc
          trap 'sudo mount -o remount,hidepid=0 /proc' EXIT
          grep ' /proc ' /proc/mounts
          dotnet test linux/tests/InfoPC.Tests/InfoPC.Tests.csproj -c Release --no-build --filter Categoria=Conferencia --logger "console;verbosity=normal"
          ./publicado/InfoPC --diagnostico
      - name: Sem tela nenhuma, explica em vez de abortar
        if: always()
        run: |
          set +e
          env -u DISPLAY -u WAYLAND_DISPLAY ./publicado/InfoPC > sem-tela.txt 2>&1; c=$?
          cat sem-tela.txt; echo "codigo: $c"
          test "$c" = 1 && grep -q 'modo texto' sem-tela.txt
      - name: Servidor sem bibliotecas graficas, em conteiner limpo
        if: always()
        run: |
          docker run --rm -v "$PWD/publicado:/p:ro" debian:12 sh -c '
            cd /p; ./InfoPC --versao
            ./InfoPC > /tmp/s.txt 2>&1; c=$?
            cat /tmp/s.txt; echo "codigo: $c"
            test "$c" = 1 && grep -q "modo texto" /tmp/s.txt
          '

  pendrive:
    name: Pen drive FAT32 e exFAT
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Testar
        run: |
          dotnet publish linux/src/InfoPC.Linux/InfoPC.Linux.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publicado -v q
          sudo apt-get update -qq
          sudo apt-get install -y -qq dosfstools exfatprogs > /dev/null
          for fs in vfat exfat; do
            echo "::group::$fs"
            truncate -s 300M "$fs.img"
            if [ "$fs" = vfat ]; then mkfs.vfat -F 32 "$fs.img"; else mkfs.exfat "$fs.img"; fi
            sudo mkdir -p "/mnt/$fs"
            sudo mount -o "loop,uid=$(id -u),gid=$(id -g),umask=022" "$fs.img" "/mnt/$fs"
            mkdir "/mnt/$fs/InfoPC"
            cp publicado/InfoPC "/mnt/$fs/InfoPC/"
            cd "/mnt/$fs/InfoPC"
            test "$(./InfoPC --versao)" != ""
            ./InfoPC --diagnostico | tee "$GITHUB_WORKSPACE/diag-$fs.txt"
            grep -q "/mnt/$fs/InfoPC/dados/" "$GITHUB_WORKSPACE/diag-$fs.txt" || { echo "os dados deveriam ficar no pen drive"; exit 1; }
            cd "$GITHUB_WORKSPACE"
            ls -laR "/mnt/$fs/InfoPC" | head -20
            echo "--- somente leitura: os dados vao para a pasta do usuario"
            sudo mount -o remount,ro "/mnt/$fs"
            (cd "/mnt/$fs/InfoPC" && ./InfoPC --diagnostico) | tee "diag-$fs-ro.txt"
            grep -q "\.local/share/InfoPC" "diag-$fs-ro.txt" || { echo "sem gravar no pen drive, deveria usar a pasta do usuario"; exit 1; }
            sudo umount "/mnt/$fs"
            echo "::endgroup::"
          done

  janela:
    name: Janela em ${{ matrix.desktop }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # o Xwayland do Ubuntu 24.04 da segfault sob o kwin_wayland virtual: fica como tentativa informativa
    continue-on-error: ${{ matrix.desktop == 'kde-wayland' }}
    strategy:
      fail-fast: false
      matrix:
        desktop: [gnome, kde-x11, kde-wayland]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar e instalar o ambiente
        run: |
          dotnet publish linux/src/InfoPC.Linux/InfoPC.Linux.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publicado -v q
          sudo apt-get update -qq
          case "${{ matrix.desktop }}" in
            gnome) pacotes="gnome-shell xwayland" ;;
            kde-x11) pacotes="kwin-x11 xvfb" ;;
            kde-wayland) pacotes="kwin-wayland kwin-wayland-backend-virtual xwayland" ;;
          esac
          sudo apt-get install -y -qq --no-install-recommends $pacotes dbus-x11 xdotool imagemagick x11-utils libice6 libsm6 libx11-6 fontconfig fonts-dejavu-core > /dev/null
      - name: Abrir a janela
        env:
          DESKTOP: ${{ matrix.desktop }}
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-conferencia; mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          cat > sessao.sh <<'EOF'
          set -x
          case "$DESKTOP" in
            gnome)
              export XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=GNOME
              gnome-shell --wayland --headless --virtual-monitor 1280x800 > shell.log 2>&1 &
              ;;
            kde-x11)
              export XDG_SESSION_TYPE=x11 XDG_CURRENT_DESKTOP=KDE
              Xvfb :77 -screen 0 1280x800x24 > xvfb.log 2>&1 &
              sleep 2; export DISPLAY=:77
              # sem isto, os servicos do KDE iniciados pelo D-Bus nao sabem da tela e o KWin nao gerencia a janela
              dbus-update-activation-environment DISPLAY XDG_SESSION_TYPE XDG_CURRENT_DESKTOP
              kwin_x11 > shell.log 2>&1 &
              ;;
            kde-wayland)
              export XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=KDE XWAYLAND_NO_GLAMOR=1
              kwin_wayland --virtual --xwayland --no-lockscreen --width 1280 --height 800 > shell.log 2>&1 &
              ;;
          esac
          shell=$!
          if [ "$DESKTOP" != kde-x11 ]; then
            for i in $(seq 1 60); do [ -S "$XDG_RUNTIME_DIR/wayland-0" ] && break; sleep 1; done
            export WAYLAND_DISPLAY=wayland-0
          fi
          sleep 10
          kill -0 "$shell" || { echo "o compositor nao ficou de pe"; cat shell.log; exit 1; }
          if [ "$DESKTOP" != kde-x11 ]; then
            n=$(ls /tmp/.X11-unix | sed 's/^X//' | sort -n | tail -1); export DISPLAY=":$n"
            a=$(ls "$XDG_RUNTIME_DIR"/.mutter-Xwaylandauth.* 2>/dev/null | head -1); [ -n "$a" ] && export XAUTHORITY="$a"
          fi
          echo "DISPLAY=$DISPLAY XAUTHORITY=$XAUTHORITY"
          ./publicado/InfoPC --diagnostico | head -3
          ./publicado/InfoPC > app.log 2>&1 &
          app=$!
          sleep 30
          kill -0 "$app" || { echo "o programa fechou"; cat app.log; exit 1; }
          id=$(timeout 20 xdotool search --onlyvisible --name '^InfoPC' | head -1)
          echo "janela: $id"; [ -n "$id" ] || { timeout 20 xwininfo -root -tree | head -30; cat app.log; exit 1; }
          timeout 20 xprop -root _NET_WM_NAME _NET_SUPPORTING_WM_CHECK || true
          timeout 20 xwininfo -id "$id" | grep -E 'Width|Height|xwininfo'
          timeout 30 import -window "$id" "tela-$DESKTOP.png"
          kill "$app"; wait "$app" 2>/dev/null
          kill "$shell"
          exit 0
          EOF
          timeout 300 dbus-run-session -- bash sessao.sh
      - name: Wayland sem XWayland, explica em vez de abortar
        if: matrix.desktop == 'gnome'
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-sem-x; mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          cat > sem-x.sh <<'EOF'
          gnome-shell --wayland --headless --no-x11 --virtual-monitor 1280x800 > shell2.log 2>&1 &
          s=$!
          for i in $(seq 1 60); do [ -S "$XDG_RUNTIME_DIR/wayland-0" ] && break; sleep 1; done
          sleep 5
          export WAYLAND_DISPLAY=wayland-0
          unset DISPLAY
          timeout 30 ./publicado/InfoPC > sem-x.txt 2>&1
          c=$?
          cat sem-x.txt
          echo "codigo sem XWayland: $c"
          kill "$s"
          test "$c" = 1 && grep -q XWayland sem-x.txt
          EOF
          timeout 180 dbus-run-session -- bash sem-x.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tela-${{ matrix.desktop }}
          path: |
            tela-*.png
            shell*.log
            app.log
            sem-x.txt
          retention-days: 7
          if-no-files-found: warn

  arm64:
    name: Pacote arm64 em ${{ matrix.imagem }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        imagem: ['debian:12', 'fedora:41', 'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Testar em conteiner limpo
        run: |
          dotnet publish linux/src/InfoPC.Linux/InfoPC.Linux.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publicado -v q
          docker run --rm -v "$PWD/publicado:/p:ro" "${{ matrix.imagem }}" sh -c '
            set -ex
            if command -v zypper > /dev/null; then zypper --non-interactive install libopenssl3 libstdc++6; fi
            mkdir /tmp/InfoPC && cp /p/InfoPC /tmp/InfoPC/ && cd /tmp/InfoPC
            uname -m
            ./InfoPC --versao
            ./InfoPC --diagnostico
            ./InfoPC --info | head -12
            ./InfoPC --json > /tmp/r.json && test -s /tmp/r.json
          '
